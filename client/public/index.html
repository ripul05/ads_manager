<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="BuzzBandits - Premier digital marketing agency specializing in Google Ads management, PPC campaigns, and performance marketing. Drive more leads and maximize your ROI."
    />
    <meta name="keywords" content="Google Ads, PPC, Digital Marketing, Pay Per Click, Online Advertising, Marketing Agency, Lead Generation" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BuzzBandits - Google Ads & Digital Marketing Agency" />
    <meta property="og:description" content="Drive more leads and maximize your ROI with BuzzBandits' expert Google Ads management and digital marketing services." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="BuzzBandits - Google Ads & Digital Marketing Agency" />
    <meta property="twitter:description" content="Drive more leads and maximize your ROI with BuzzBandits' expert Google Ads management and digital marketing services." />
    <meta property="twitter:image" content="%PUBLIC_URL%/twitter-image.jpg" />
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>BuzzBandits</title>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>BuzzBandits - Digital Marketing Agency</h1>
        <p>You need to enable JavaScript to run this app and access our full range of digital marketing services.</p>
        <p>We specialize in Google Ads management and performance marketing to help grow your business.</p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
